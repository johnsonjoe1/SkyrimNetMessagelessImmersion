; ===========================================================================================
; SkyrimNetMessagelessImmersion Configuration:  Some settings are working already, see below.
; 
; Section and key names here should be case-insensitive. [Thoughts], [thoughts], and 
; [THOUGHTS] should be treated identically. The same applies to setting names.
;
; Spaces around = should be irrelevant. SomeThought=1 and SomeThought = 1 produce the same result.
;
; ===========================================================================================

[General]

; DUMMY-SWITCH, THIS DOESN'T DO ANYHTING YET:  Enable or disable the plugin.
; POSSIBLE VALUES ARE 1 AND 0  
EnablePlugin=1

; Controls verbose native logging and the bridge's guarded Papyrus traces.
; 0 keeps native warnings/errors after startup configuration and disables those Papyrus traces.
; Does not disable HUD reports or character-name-dependent debug popups. Restart after editing.
; POSSIBLE VALUES ARE 1 AND 0  
DebugLogging=1


[Timing]

; How often, in whole seconds, periodic checks are performed. Values below 1 are treated as 1.
UpdateInterval=5

; How much silence do we require, before your character might spontaneously start to complain about some background pains like
; lingering fatigue, hunger, thirst, sicknesses or pains.
; Non-negative whole seconds; invalid values fall back to 90. Lillith currently uses 20 instead.
; Does not change fixed delays for separately queued thoughts, such as YPS style changes.
SilenceRequiredBeforeSpontaneousStatusWhining=90

[Thoughts]

; Enable thoughts related to SLSF Reloaded fame changes. Set to 0 to disable them.
; POSSIBLE VALUES ARE 1 AND 0
enableSLSFthoughts=1

; Minimum fame increase or decrease per category since the previous check required for a thought.
; Non-negative whole numbers. Default is 5; 0 allows any change. Negative values fall back to 5.
SLSFthoughtThreshold=5

; Shared cooldown between SLSF thoughts, in seconds.
; Non-negative whole numbers. Default is 300; 0 disables the cooldown. Negative values fall back to 300.
SLSFthoughtCooldown=300

; Enable spontaneous status complaints after silence, such as repeatedly whining because of the worst stage of hunger or the worst stage of a disease or the worst stage of fatigue. Set to 0 to disable them completely, including for Lillith.
; POSSIBLE VALUES ARE 1 AND 0
EnableConstantWhining=1

; Enable milk, lactacid, maid-level, and milk-status thoughts, Milk Pump furniture thoughts,
; and Devious Followers milking thoughts. Set to 0 to disable all of them. Default is 1.
; Suppressed thoughts are logged when DebugLogging=1. Restart after editing.
; POSSIBLE VALUES ARE 1 AND 0  
EnableMilkThoughts=1

; THIS SWITCH IS NOW LIVE:  Enable player-thoughts when the guards come after you, opening up the possibility of a nice cat-and-mouse game with them.
; POSSIBLE VALUES ARE 1 AND 0  
EnableLicensesPlayerOppressionThoughts=1

; THIS SWITCH IS NOW LIVE:  Enable player-dirt-thoughts, based on the player's current dirtiness level and dirtyness changes.  
; POSSIBLE VALUES ARE 1 AND 0  
EnablePlayerDirtThoughts=1

; THIS SWITCH IS NOW LIVE:  Enable AND nudity status/change thoughts.
; POSSIBLE VALUES ARE 1 AND 0  
EnableANDNudityThoughts=1

; DUMMY-SWITCH, THIS DOESN'T DO ANYHTING YET:  Enable thoughts based on Apropos2 data.
; POSSIBLE VALUES ARE 1 AND 0  
EnableAproposThoughts=1

; Enable relaying YPS's own YPS_ThoughtEvent text. Does not disable all SNMI fashion observations.
; POSSIBLE VALUES ARE 1 AND 0  
EnableDirectPushOfYPSThoughtsToSkyrimNetPlayerThoughts=1

