; ============================================
; SkyrimNetMessagelessImmersion Configuration
; ============================================

[General]

; Enable or disable the plugin.
EnablePlugin=true

; Write additional diagnostic information to the log.
DebugLogging=false


[Timing]

; How often, in seconds, periodic checks are performed.
UpdateInterval=5.0


[Thoughts]

; Enable thoughts related to Milk Mod Economy.
EnableMilkThoughts=true

; Enable thoughts based on Apropos2 data.
EnableAproposThoughts=true

; Enable thoughts related to yps-ImmersiveFashion.
EnableYPSThoughts=true

